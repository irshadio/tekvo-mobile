name: core
description: Shared infrastructure, theme and localization for the Tekvo apps.
publish_to: none
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  connectivity_plus: ^7.3.2
  # Required by the vendored remote_client (lib/vendor/remote_client).
  country: ^7.0.0
  dio: ^5.11.0
  envied: ^1.3.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  intl: any
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  riverpod_annotation: ^4.0.2
  sembast: ^3.8.7

dev_dependencies:
  build_runner: ^2.15.0
  envied_generator: ^1.3.5
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  # Prerelease codegen pinned exactly: the $Notifier guard tests depend on it.
  freezed: 3.2.6-dev.1
  json_serializable: ^6.14.0
  riverpod_generator: 4.0.4-dev.1
  very_good_analysis: ^10.2.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/fonts/inter/OFL.txt
    - assets/icons/
    - assets/icons/benefit/
    - assets/icons/chip/
    - assets/icons/hero/
    - assets/images/onboarding/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.otf
        - asset: assets/fonts/inter/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.otf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.otf
          weight: 800
