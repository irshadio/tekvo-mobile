include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
    always_use_package_imports: error
    avoid_print: error
    todo: error
    fixme: error
    hack: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/lib/l10n/generated/**"
    - "**/build/**"
    - "local_dev/**"

linter:
  rules:
    public_member_api_docs: false
